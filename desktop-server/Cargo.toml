[package]
name = "desktop-server"
version = "0.1.0"
edition = "2021"
default-run = "desktop-server"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.7.5", features = ["macros", "ws"] }
base64 = "0.22.1"
chrono = { version = "0.4.38", features = ["serde"] }
crossterm = "0.28.1"
dotenvy = "0.15.7"
dirs = "5"
eventsource-stream = "0.2"
futures-util = "0.3.30"
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "0.15.0", default-features = false, features = ["client", "server", "transport-child-process", "macros", "schemars"] }
portable-pty = "0.8"
schemars = "0.8"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread", "time", "net", "sync", "signal", "fs", "process"] }
tokio-tungstenite = "0.28.0"
toml = "0.8.14"
tower-http = { version = "0.5.2", features = ["cors", "trace"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
codex-config = { path = "../third_party/codex-rs/config" }
codex-login = { path = "../third_party/codex-rs/login" }
codex-protocol = { path = "../third_party/codex-rs/protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
xcap = "0.4.1"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
