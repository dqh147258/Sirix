[server]
host = "0.0.0.0"
port = 8080

[logging]
level = "trace"
json = false

[postgres]
url = "postgres://freeloom:freeloom@127.0.0.1:5432/freeloom"

[redis]
url = "redis://127.0.0.1:6379"

[auth]
access_token_ttl_minutes = 15
refresh_token_ttl_days = 30

[webrtc]
ice_servers = [
  "stun:stun.l.google.com:19302",
  "turn:127.0.0.1:3478?transport=udp"
]
