name: client
description: Sirix Flutter shell project for multi-entry apps.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1

  app_core:
    path: packages/app_core
  feature_auth:
    path: packages/feature_auth
  feature_device_list:
    path: packages/feature_device_list
  feature_terminal:
    path: packages/feature_terminal
  feature_remote_view:
    path: packages/feature_remote_view
  feature_desktop_authorize:
    path: packages/feature_desktop_authorize
  infra_api:
    path: packages/infra_api
  infra_webrtc:
    path: packages/infra_webrtc
  flutter_webrtc:
    path: third_party/flutter-webrtc

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
