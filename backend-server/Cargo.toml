[package]
name = "backend-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.7.5", features = ["macros", "ws"] }
chrono = { version = "0.4.38", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.30"
hex = "0.4"
indexmap = "=2.2.6"
rand = "0.8.5"
redis = { version = "=0.23.3", features = ["tokio-comp"] }
postgres-protocol = "=0.6.6"
postgres-types = "=0.2.6"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
sha2 = "0.10"
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tokio-postgres = { version = "=0.7.8", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
toml = "0.8.14"
tower-http = { version = "0.5.2", features = ["cors", "trace"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json", "fmt"] }
url = "=2.4.1"
uuid = { version = "=1.8.0", features = ["serde", "v4"] }
